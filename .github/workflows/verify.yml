name: Verify public proofs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run protocol tests
        run: bun run test

      - name: Verify public swarm receipts
        run: bun run verify:receipts

      - name: Verify cryptographic baton relay
        if: ${{ hashFiles('receipts/baton-relay.json') != '' }}
        run: bun run verify:relay

      - name: Verify deterministic relay constellation
        run: |
          bun run render:relay
          git diff --exit-code -- assets/baton-relay.svg
          bun run verify:svg

      - name: Verify signed story chain
        if: ${{ hashFiles('receipts/story-chain.json') != '' }}
        run: bun run verify:story

      - name: Verify deterministic story card
        if: ${{ hashFiles('receipts/story-chain.json') != '' }}
        run: |
          bun run render:story
          git diff --exit-code -- assets/story-chain.svg
          bun run verify:story-card

      - name: Verify protocol observatory snapshot
        if: ${{ hashFiles('receipts/protocol-observatory.json') != '' }}
        run: bun run verify:observatory

      - name: Verify deterministic observatory map
        if: ${{ hashFiles('receipts/protocol-observatory.json') != '' }}
        run: |
          bun run render:observatory
          git diff --exit-code -- assets/protocol-observatory.svg
          bun run verify:observatory-map

      - name: Verify signed room time capsule
        if: ${{ hashFiles('receipts/room-time-capsule.json') != '' }}
        run: bun run verify:capsule

      - name: Verify referee evidence and announcement
        run: bun run verify:referee

      - name: Check final public tree for credentials
        run: bun run audit:secrets
